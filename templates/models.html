<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模型管理 - Llama Manager</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .model-row { cursor: pointer; transition: background 0.15s; }
    .model-row:hover { background: #f5f5f5; }
    .model-row.expanded { background: #e6f7ff; }
    .model-detail { display: none; padding: 16px 24px; background: #fafafa; border-left: 3px solid #1890ff; }
    .model-detail.show { display: block; }
    .model-detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .model-detail-item { padding: 8px 12px; background: #fff; border: 1px solid #f0f0f0; border-radius: 4px; }
    .model-detail-item .label { font-size: 12px; color: #999; margin-bottom: 4px; }
    .model-detail-item .value { font-size: 14px; color: #333; word-break: break-all; }
    .model-path { font-family: monospace; font-size: 12px; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .model-quant { display: inline-block; padding: 2px 8px; background: #f0f0f0; border-radius: 3px; font-size: 12px; font-weight: 600; }
    .model-params { font-weight: 600; color: #1890ff; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: 8px; padding: 24px; min-width: 400px; max-width: 600px; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; padding-top: 16px; border-top: 1px solid #f0f0f0; }
    .dir-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid #f0f0f0; border-radius: 4px; margin-bottom: 8px; cursor: pointer; transition: background 0.15s; }
    .dir-item:hover { background: #f5f5f5; }
    .dir-item input[type="checkbox"] { width: 16px; height: 16px; }
    .dir-item .dir-path { flex: 1; font-family: monospace; font-size: 13px; word-break: break-all; }
    .dir-item .dir-status { font-size: 12px; color: #999; white-space: nowrap; }
    .dir-item .dir-status.exists { color: #52c41a; }
    .dir-item .dir-status.missing { color: #ff4d4f; }
    .custom-dir { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #f0f0f0; }
    .custom-dir input { flex: 1; padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">🦙 <span>Llama Manager</span></div>
      <nav>
        <a href="/dashboard"><span>📊 仪表盘</span></a>
        <a href="/workspaces"><span>📁 空间管理</span></a>
        <a href="/instances"><span>⚙️ 推理框架</span></a>
        <a href="/gpu"><span>🖥️ GPU 监控</span></a>
        <a href="/models"><span>📦 模型管理</span></a>
      </nav>
    </aside>
    <main class="main">
      <div class="toolbar">
        <h2 style="margin:0;">模型管理</h2>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="openDirPicker()">📂 选择目录</button>
          <button class="btn" onclick="scanModels()">🔍 扫描</button>
          <span id="scan-summary" style="font-size:13px;color:#666;line-height:32px;"></span>
        </div>
      </div>

      <!-- Selected dirs -->
      <div id="selected-dirs" style="margin-bottom:12px;font-size:13px;color:#666;display:none;">
        已选目录: <span id="selected-dirs-list"></span>
      </div>

      <!-- Model list -->
      <div class="card">
        <table>
          <thead>
            <tr>
              <th style="width:30px;"></th>
              <th>文件名</th>
              <th>参数量</th>
              <th>量化格式</th>
              <th>大小</th>
              <th>路径</th>
            </tr>
          </thead>
          <tbody id="model-table">
            <tr><td colspan="6" style="text-align:center;color:#999;padding:40px;">点击"选择目录"然后"扫描"开始</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Directory picker modal -->
  <div class="modal-overlay" id="dir-modal">
    <div class="modal-box">
      <div class="modal-title">选择扫描目录</div>
      <div id="dir-list">加载中...</div>
      <div class="custom-dir">
        <input type="text" id="custom-dir-input" placeholder="或手动输入目录路径...">
        <button class="btn btn-sm" onclick="addCustomDir()">添加</button>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeDirPicker()">取消</button>
        <button class="btn btn-primary" onclick="confirmDirs()">确认并扫描</button>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
let selectedDirs = [];
let modelsData = [];
let expandedModel = null;

// ── Directory picker ─────────────────────────────────────────
async function openDirPicker() {
  document.getElementById('dir-modal').classList.add('show');
  document.getElementById('dir-list').innerHTML = '加载中...';

  try {
    const dirs = await api('/api/runtime/models/directories');
    const list = document.getElementById('dir-list');
    list.innerHTML = dirs.map((d, i) => `
      <div class="dir-item" onclick="this.querySelector('input').click()">
        <input type="checkbox" value="${d.path}" ${selectedDirs.includes(d.path) ? 'checked' : ''}>
        <span class="dir-path">${d.path}</span>
        <span class="dir-status ${d.exists ? 'exists' : 'missing'}">
          ${d.exists ? (d.model_count + ' 个模型' ) : '不存在'}
        </span>
      </div>
    `).join('');
  } catch(e) {
    document.getElementById('dir-list').innerHTML = '<span style="color:#ff4d4f;">加载目录失败</span>';
  }
}

function closeDirPicker() {
  document.getElementById('dir-modal').classList.remove('show');
}

function addCustomDir() {
  const input = document.getElementById('custom-dir-input');
  const path = input.value.trim();
  if (!path) return;
  if (!selectedDirs.includes(path)) {
    selectedDirs.push(path);
  }
  input.value = '';
  // Add to list visually
  const list = document.getElementById('dir-list');
  const div = document.createElement('div');
  div.className = 'dir-item';
  div.innerHTML = `
    <input type="checkbox" value="${path}" checked>
    <span class="dir-path">${path}</span>
    <span class="dir-status">自定义</span>
  `;
  list.appendChild(div);
}

function confirmDirs() {
  // Collect checked dirs
  selectedDirs = [];
  document.querySelectorAll('#dir-list input[type="checkbox"]:checked').forEach(cb => {
    selectedDirs.push(cb.value);
  });
  closeDirPicker();

  // Show selected
  const el = document.getElementById('selected-dirs');
  const list = document.getElementById('selected-dirs-list');
  if (selectedDirs.length) {
    el.style.display = 'block';
    list.textContent = selectedDirs.join(', ');
  } else {
    el.style.display = 'none';
  }

  scanModels();
}

// ── Scan ─────────────────────────────────────────────────────
async function scanModels() {
  const tb = document.getElementById('model-table');
  tb.innerHTML = '<tr><td colspan="6" class="loading">扫描中...</td></tr>';

  try {
    let result;
    if (selectedDirs.length) {
      result = await api('/api/runtime/models/scan', {
        method: 'POST',
        body: JSON.stringify({ directories: selectedDirs })
      });
    } else {
      result = await api('/api/runtime/models/scan');
    }

    modelsData = result || [];
    expandedModel = null;

    if (!modelsData.length) {
      tb.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;padding:40px;">未找到 .gguf 文件</td></tr>';
      document.getElementById('scan-summary').textContent = '';
      return;
    }

    renderModels();
    document.getElementById('scan-summary').textContent = `共 ${modelsData.length} 个模型`;
    toast('扫描完成，共 ' + modelsData.length + ' 个模型', 'success');
  } catch(e) {
    tb.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#ff4d4f;">扫描失败: ' + e.message + '</td></tr>';
  }
}

function renderModels() {
  const tb = document.getElementById('model-table');
  tb.innerHTML = modelsData.map((m, i) => `
    <tr class="model-row ${expandedModel === i ? 'expanded' : ''}" onclick="toggleModel(${i})">
      <td>${expandedModel === i ? '▼' : '▶'}</td>
      <td><b>${esc(m.name)}</b></td>
      <td><span class="model-params">${m.metadata.params || '-'}</span></td>
      <td><span class="model-quant">${m.metadata.quant || '-'}</span></td>
      <td>${m.size_human}</td>
      <td class="model-path" title="${esc(m.path)}">${esc(m.path)}</td>
    </tr>
    <tr class="model-detail ${expandedModel === i ? 'show' : ''}">
      <td colspan="6">
        <div class="model-detail-grid">
          <div class="model-detail-item">
            <div class="label">完整文件名</div>
            <div class="value">${esc(m.name)}</div>
          </div>
          <div class="model-detail-item">
            <div class="label">参数量</div>
            <div class="value model-params">${m.metadata.params || '未知'}</div>
          </div>
          <div class="model-detail-item">
            <div class="label">量化格式</div>
            <div class="value"><span class="model-quant">${m.metadata.quant || '未知'}</span></div>
          </div>
          <div class="model-detail-item">
            <div class="label">文件大小</div>
            <div class="value">${m.size_human} (${m.size_bytes.toLocaleString()} bytes)</div>
          </div>
          <div class="model-detail-item">
            <div class="label">完整路径</div>
            <div class="value model-path" title="${esc(m.path)}">${esc(m.path)}</div>
          </div>
          <div class="model-detail-item">
            <div class="label">所在目录</div>
            <div class="value model-path">${esc(m.dir)}</div>
          </div>
          <div class="model-detail-item" style="grid-column: 1 / -1;">
            <div class="label">快速使用</div>
            <div class="value">
              <code style="font-size:12px;background:#f0f0f0;padding:4px 8px;border-radius:3px;cursor:pointer;" onclick="copyPath('${esc(m.path)}')" title="点击复制">
                --model ${esc(m.path)}
              </code>
              <span style="font-size:12px;color:#999;margin-left:8px;">点击复制模型路径</span>
            </div>
          </div>
        </div>
      </td>
    </tr>
  `).join('');
}

function toggleModel(i) {
  expandedModel = expandedModel === i ? null : i;
  renderModels();
}

function copyPath(path) {
  navigator.clipboard.writeText(path).then(() => {
    toast('路径已复制: ' + path, 'success');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = path;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('路径已复制', 'success');
  });
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
  </script>
</body>
</html>
