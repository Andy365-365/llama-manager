{% extends "base.html" %}
{% block title %}仪表盘 - Llama Manager{% endblock %}
{% block head %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  .gpu-chart-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .gpu-chart-toolbar label { font-size: 13px; color: #666; }
  .gpu-chart-toolbar select { padding: 4px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 13px; background: #fff; }
  .gpu-chart-toolbar .status { margin-left: auto; font-size: 12px; color: #999; display: flex; align-items: center; gap: 6px; }
  .gpu-chart-toolbar .status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .gpu-chart-toolbar .status .dot.live { background: #52c41a; animation: pulse 2s infinite; }
  .gpu-chart-toolbar .status .dot.off { background: #d9d9d9; animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  #gpu-chart { width: 100%; height: 380px; }
  .running-empty { text-align: center; padding: 30px; color: #bbb; font-size: 14px; }
</style>
{% endblock %}
{% block content %}
<h2 style="margin-bottom:20px;">仪表盘</h2>

<!-- GPU Real-time Chart -->
<div class="card">
  <div class="card-header">
    <span class="card-title">📈 GPU 实时监控</span>
  </div>
  <div class="gpu-chart-toolbar">
    <label>时间范围:</label>
    <select id="chart-range" onchange="fetchChartData()">
      <option value="10">最近 10 分钟</option>
      <option value="30" selected>最近 30 分钟</option>
      <option value="60">最近 1 小时</option>
      <option value="180">最近 3 小时</option>
      <option value="1440">最近 24 小时</option>
    </select>
    <label>GPU:</label>
    <select id="chart-gpu" onchange="fetchChartData()">
      <option value="-1">全部 GPU</option>
    </select>
    <div class="status">
      <span class="dot" id="live-dot"></span>
      <span id="live-text">加载中...</span>
    </div>
  </div>
  <div id="gpu-chart"></div>
</div>

<!-- Running Instances -->
<div class="card">
  <div class="card-header">
    <span class="card-title">🚀 运行中的实例</span>
  </div>
  <table>
    <thead>
      <tr><th>名称</th><th>空间</th><th>推理框架</th><th>PID</th><th>端口</th><th>运行时长</th><th>操作</th></tr>
    </thead>
    <tbody id="running-table">
      <tr><td colspan="7" class="loading">加载中...</td></tr>
    </tbody>
  </table>
</div>

{% endblock %}
{% block scripts %}
<script>
let chart = null;
let gpuCount = 0;
let refreshTimer = null;

async function init() {
  // Get GPU info to populate selector
  const gpu = await api('/api/runtime/gpu/info');
  const gpus = gpu.gpus || [];
  gpuCount = gpus.length;

  const sel = document.getElementById('chart-gpu');
  sel.innerHTML = '<option value="-1">全部 GPU</option>' +
    gpus.map(g => `<option value="${g.index}">GPU ${g.index}: ${g.name}</option>`).join('');

  // Init chart
  chart = echarts.init(document.getElementById('gpu-chart'));
  window.addEventListener('resize', () => chart.resize());

  // Load data
  fetchChartData();
  loadRunning();

  // Auto-refresh: chart every 10s, running every 15s
  setInterval(fetchChartData, 10000);
  setInterval(loadRunning, 15000);
}

async function fetchChartData() {
  const minutes = parseInt(document.getElementById('chart-range').value);
  const gpuVal = document.getElementById('chart-gpu').value;
  const params = new URLSearchParams({ minutes: String(minutes) });
  if (gpuVal !== '-1') params.set('gpu_index', gpuVal);

  const data = await api('/api/runtime/gpu/history?' + params.toString());
  if (!data || !data.length) {
    chart.setOption({ series: [] });
    updateLiveStatus(false);
    return;
  }

  updateLiveStatus(true);

  const selectedGpu = gpuVal !== '-1' ? parseInt(gpuVal) : -1;
  const gpuIndices = [...new Set(data.map(d => d.gpu_index))];

  // Color palette per GPU
  const colors = ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de', '#3ba272'];

  const series = [];

  // ── GPU Utilization (%) ──
  gpuIndices.forEach(idx => {
    const pts = data.filter(d => d.gpu_index === idx).map(d => [new Date(d.timestamp), d.utilization_gpu]);
    const label = gpuIndices.length === 1 ? 'GPU 利用率' : `GPU ${idx} 利用率`;
    series.push({
      name: label, type: 'line', data: pts, smooth: true, symbol: 'none',
      lineStyle: { width: 2.5 },
      itemStyle: { color: colors[idx % colors.length] },
      areaStyle: { opacity: 0.08 },
      yAxisIndex: 0,
    });
  });

  // ── Temperature (°C) ──
  gpuIndices.forEach(idx => {
    const pts = data.filter(d => d.gpu_index === idx).map(d => [new Date(d.timestamp), d.temperature]);
    const label = gpuIndices.length === 1 ? '温度' : `GPU ${idx} 温度`;
    series.push({
      name: label, type: 'line', data: pts, smooth: true, symbol: 'none',
      lineStyle: { width: 2 },
      itemStyle: { color: '#ee6666' },
      yAxisIndex: 1,
    });
  });

  // ── Power (W) ──
  gpuIndices.forEach(idx => {
    const pts = data.filter(d => d.gpu_index === idx).map(d => [new Date(d.timestamp), d.power_usage]);
    const label = gpuIndices.length === 1 ? '功耗' : `GPU ${idx} 功耗`;
    series.push({
      name: label, type: 'line', data: pts, smooth: true, symbol: 'none',
      lineStyle: { width: 2 },
      itemStyle: { color: '#fac858' },
      yAxisIndex: 2,
    });
  });

  const option = {
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross' },
      formatter: function(params) {
        let s = '<b>' + params[0].axisValueLabel + '</b><br>';
        params.forEach(p => {
          const unit = p.seriesName.includes('利用率') ? '%' : p.seriesName.includes('温度') ? '°C' : 'W';
          s += p.marker + ' ' + p.seriesName + ': <b>' + p.value[1].toFixed(1) + unit + '</b><br>';
        });
        return s;
      }
    },
    legend: {
      data: series.map(s => s.name),
      bottom: 0,
      textStyle: { fontSize: 12 },
      type: 'scroll',
    },
    grid: { left: 55, right: 55, top: 20, bottom: 55 },
    xAxis: {
      type: 'time',
      axisLabel: { formatter: '{HH}:{mm}', fontSize: 11 },
      splitLine: { show: true, lineStyle: { type: 'dashed', color: '#f0f0f0' } },
    },
    yAxis: [
      {
        type: 'value', name: '利用率 (%)', position: 'left', offset: 0,
        min: 0, max: 100,
        axisLabel: { formatter: '{value}%', fontSize: 11 },
        splitLine: { lineStyle: { color: '#f5f5f5' } },
      },
      {
        type: 'value', name: '温度 (°C)', position: 'right', offset: 50,
        axisLabel: { formatter: '{value}°C', fontSize: 11 },
        splitLine: { show: false },
      },
      {
        type: 'value', name: '功耗 (W)', position: 'right', offset: 100,
        axisLabel: { formatter: '{value}W', fontSize: 11 },
        splitLine: { show: false },
      },
    ],
    series: series,
    dataZoom: [{ type: 'inside', xAxisIndex: 0, start: 0, end: 100 }],
  };

  chart.setOption(option, { replaceMerge: ['series', 'yAxis', 'legend'] });
}

async function loadRunning() {
  const status = await api('/api/runtime/status/all');
  const running = status.filter(s => s.status === 'running');
  const rt = document.getElementById('running-table');

  if (running.length === 0) {
    rt.innerHTML = '<tr><td colspan="7" class="running-empty">暂无运行中的实例</td></tr>';
    return;
  }

  rt.innerHTML = running.map(s => {
    const elapsed = s.started_at ? timeAgo(new Date(s.started_at)) : '-';
    return `
      <tr>
        <td><a href="/config/${s.id}/edit">${esc(s.name)}</a></td>
        <td>${esc(s.workspace_name)}</td>
        <td>${esc(s.llama_instance_name || '-')}</td>
        <td>${s.pid || '-'}</td>
        <td>${s.port || '-'}</td>
        <td style="color:#999;font-size:13px;">${elapsed}</td>
        <td>
          <div class="btn-group">
            <button class="btn btn-sm btn-danger" onclick="doStop(${s.id})">停止</button>
            <a href="/config/${s.id}/log" class="btn btn-sm">日志</a>
          </div>
        </td>
      </tr>`;
  }).join('');
}

async function doStop(cid) {
  const r = await api(`/api/runtime/${cid}/stop`, { method: 'POST' });
  if (r.ok) { toast('已停止', 'success'); loadRunning(); }
  else toast(r.error, 'error');
}

function updateLiveStatus(on) {
  const dot = document.getElementById('live-dot');
  const txt = document.getElementById('live-text');
  dot.className = 'dot ' + (on ? 'live' : 'off');
  txt.textContent = on ? '实时刷新中 (10s)' : '暂无数据';
}

function timeAgo(date) {
  const diff = (Date.now() - date.getTime()) / 1000;
  if (diff < 60) return Math.floor(diff) + ' 秒';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时';
  return Math.floor(diff / 86400) + ' 天';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
{% endblock %}
